name: taglibro_cli
description: >
  Terminal client for taglibro — read/write your own diaries via
  Supabase directly, sharing the same RLS and RPC contract as the
  Flutter web/mobile app. Pure-Dart, no Flutter SDK required.
publish_to: 'none'
version: 0.1.0
homepage: https://github.com/chai0204/taglibro-cli
repository: https://github.com/chai0204/taglibro-cli

environment:
  sdk: ^3.6.0

dependencies:
  # Pure-Dart Supabase client (the same one supabase_flutter is built
  # on). 2.10.x matches what the Flutter app resolves to so REST /
  # RPC behaviour is identical.
  supabase: ^2.10.0

  # Standard CLI ergonomics.
  args: ^2.5.0
  path: ^1.9.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
